<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript DOM and Event Handling </title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <h1 id="heading">Hello</h1>
    </header>
    <main>
        <div class="main-container ">
            <div class="box-color" data-color="red"><p>Red</p></div>
            <div class="box-color" data-color="blue"><p>Blue</p></div>
            <div class="box-color" data-color="green"><p>Green</p></div>
            <div class="box-color" data-color="yellow"><p>Yellow</p></div>
        </div>
        <div class="input-section">
            <input type="text" id="input-name" placeholder="Ener your name">
            <button id="greet-btn">Greet</button>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
